<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Statistika — Oila byudjeti</title>
<style>
body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:#f2f5fb;color:#0e1628;padding:24px 16px}
.w{max-width:560px;margin:0 auto;display:grid;gap:14px}
h1{margin:0;font-size:22px}p{margin:0;color:#5d677c;font-size:13px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.c{background:#fff;border:1px solid #e3e8f1;border-radius:18px;padding:16px;box-shadow:0 10px 28px -14px rgba(16,24,40,.14)}
.c small{display:block;color:#5d677c;font-size:12.5px}.c b{display:block;font-size:30px;margin-top:2px}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:10px}
.bars div{flex:1;background:#12a37a;border-radius:6px 6px 2px 2px;position:relative;min-height:3px}
.bars span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:#7c879c}
.bars em{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:10px;font-style:normal;color:#273046}
</style></head><body><div class="w">
<h1>📊 Oila byudjeti — statistika</h1>
<p>Faqat anonim sonlar. Ism, telefon yoki moliyaviy maʼlumot yiğilmaydi. Sonlar taxminiy.</p>
<div class="g">
 <div class="c"><small>🤖 APK yuklab olingan</small><b id="dl">…</b></div>
 <div class="c"><small>📱 Jami örnatilgan</small><b id="inst">…</b></div>
 <div class="c"><small>Android</small><b id="and">…</b></div>
 <div class="c"><small>iPhone / brauzer</small><b id="web">…</b></div>
</div>
<div class="c"><small>👥 Kunlik faol foydalanuvçilar (söngi 7 kun)</small><div class="bars" id="bars"></div><div style="height:18px"></div></div>
<p id="upd"></p>
</div>
<script src="config.js"></script>
<script>
const C = window.APP_CONFIG || {};
const NS = ('ob-' + C.owner + '-' + C.repo).toLowerCase().replace(/[^a-z0-9-]/g, '-');
const BASE = 'https://countapi.mileshilliard.com/api/v1/get/';
const get = k => fetch(BASE + NS + '-' + k).then(r => r.json()).then(j => +j.value || 0).catch(() => 0);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
(async () => {
  fetch(`https://api.github.com/repos/${C.owner}/${C.repo}/releases?per_page=100`).then(r => r.json())
    .then(rs => { document.getElementById('dl').textContent = rs.reduce((s, r) => s + (r.assets || []).reduce((a, x) => a + x.download_count, 0), 0); })
    .catch(() => document.getElementById('dl').textContent = '—');
  const [i, a, w] = await Promise.all([get('installs'), get('installs-android'), get('installs-web')]);
  document.getElementById('inst').textContent = i; document.getElementById('and').textContent = a; document.getElementById('web').textContent = w;
  const days = [...Array(7)].map((_, k) => { const d = new Date(); d.setDate(d.getDate() - 6 + k); return d; });
  const vals = await Promise.all(days.map(d => get('dau-' + ymd(d))));
  const mx = Math.max(1, ...vals);
  document.getElementById('bars').innerHTML = vals.map((v, k) => `<div style="height:${v / mx * 100}%"><em>${v}</em><span>${days[k].getDate()}.${pad(days[k].getMonth() + 1)}</span></div>`).join('');
  document.getElementById('upd').textContent = 'Yangilandi: ' + new Date().toLocaleString();
})();
</script></body></html>
