name: Ilovani yasash

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Shriftlarni yuklash
        run: |
          mkdir -p www/fonts
          tr -d '\r' < font_list.txt | while read -r url file; do
            [ -n "$url" ] && curl -fsSL "$url" -o "www/fonts/$file" || true
          done

      - name: Kutubxonalar
        run: npm install

      - name: Android loyihasi
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#12a37a' --iconBackgroundColorDark '#12a37a' --splashBackgroundColor '#f2f5fb' --splashBackgroundColorDark '#0a0f1e' || echo "ikonka yasalmadi"
          node scripts/patch-android.js
          npx cap sync android

      - name: APK va AAB yasash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          mkdir -p ../out
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            ./gradlew assembleRelease bundleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../out/OilaByudjeti.apk
            cp app/build/outputs/bundle/release/app-release.aab ../out/OilaByudjeti.aab
          else
            echo "::warning::KEYSTORE_BASE64 sozlanmagan — sinov (debug) APK yasaldi"
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../out/OilaByudjeti.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: OilaByudjeti-android
          path: out/

      - name: Releases bölimiga joylash
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Oila byudjeti (yig‘ma ${{ github.run_number }})
          files: out/OilaByudjeti.apk
          make_latest: true

  web-build:
    name: iPhone veb-ilova (tayyorlash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Shriftlarni yuklash
        run: |
          mkdir -p www/fonts
          tr -d '\r' < font_list.txt | while read -r url file; do
            [ -n "$url" ] && curl -fsSL "$url" -o "www/fonts/$file" || true
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: www

  web-deploy:
    name: iPhone veb-ilova (joylash)
    needs: web-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
